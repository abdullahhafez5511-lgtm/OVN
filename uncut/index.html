<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ar{font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;font-weight:700}
.en{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:900;letter-spacing:-2px}
.qty{display:flex;align-items:center;gap:8px}
.qty span{min-width:18px;text-align:center;font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:10}
#sheet .box{width:100%;max-height:85vh;overflow:auto;padding:16px;max-width:640px;margin:auto}
#sheet h2{margin:0 0 10px}
input,textarea{width:100%;font:inherit;padding:10px;margin-top:8px}
.tot{font-weight:800;font-size:18px;margin:10px 0}
.go,.x{width:100%;border:0;font:inherit;font-weight:800;padding:14px;margin-top:10px}
#bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none}
#bar button{width:100%;border:0;font:inherit;font-size:17px;font-weight:800;padding:14px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px}
nav button{flex:none;border:0;font:inherit;font-size:15px;font-weight:700;padding:8px 16px}
main{padding:12px;max-width:640px;margin:auto}
.item{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:12px}
.item .i{flex:1;display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline}
.item b{font-size:17px}.item small{grid-column:1/3;line-height:1.5;margin-top:2px}
.price{white-space:nowrap}
header{text-align:center}header .ar{font-size:46px;line-height:1.1}header .en{font-size:44px;line-height:1;margin-top:6px}
#tbl{display:inline-block;margin-top:8px;border-radius:20px;padding:3px 12px;font-size:13px}
footer{text-align:center;font-size:12px;padding:16px}
#splash{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .8s ease;opacity:1}
#splash .ar{font-size:72px;line-height:1.1}#splash.out{opacity:0}

body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#0b0b0b;color:#f4f1ea;padding-bottom:90px}
header{background:#000;color:#fff;padding:40px 16px 34px;border-bottom:3px solid #ffd21f}
header .en{color:#ffd21f}
#tbl{background:#ffd21f;color:#111;font-weight:800}
nav{background:#0b0b0bee;backdrop-filter:blur(8px);border-bottom:1px solid #2a2a2a}
nav button{background:#1b1b1b;color:#cfcac0;border-radius:6px;border:1px solid #333}
nav button.on{background:#ffd21f;color:#111;border-color:#ffd21f}
