*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.qty{display:flex;align-items:center;gap:8px}

input,textarea{width:100%;font:inherit;padding:10px;margin-top:8px}
.tot{font-weight:800;font-size:18px;margin:10px 0}
.go,.x{width:100%;border:0;font:inherit;font-weight:800;padding:14px;margin-top:10px}

nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px}

main{padding:12px;max-width:640px;margin:auto}
.item{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:12px}

.item b{font-size:17px}.item small{grid-column:1/3;line-height:1.5;margin-top:2px}

footer{text-align:center;font-size:12px;padding:16px}

#splash .ar{font-size:72px;line-height:1.1}#splash.out{opacity:0}

<script>
var $=function(i){return document.getElementById(i)};
var cart={},cur=0,q=new URLSearchParams(location.search);
function key(c,i){return c+"-"+i}
function drawNav(){$("nav").innerHTML="";CONFIG.categories.forEach(function(c,i){var b=document.createElement("button");b.textContent=c.name;b.className=i==cur?"on":"";b.onclick=function(){cur=i;sq="";$("sr").value="";$("nav").style.opacity="1";drawNav();drawList();window.scrollTo(0,0)};$("nav").appendChild(b)});var on=$("nav").querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"})}
var HOT={"سموك أن كات":1,"أن كات برجر - سنجل":1,"بافلو برجر - سنجل":1,"جراند أن كات":1,"ميكس جريل":1,"بوكس كبير":1};
function norm(t){return (t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").toLowerCase().trim()}
var sq="";
function drawList(){var l=$("list");l.innerHTML="";var arr=[];
if(sq){CONFIG.categories.forEach(function(c,ci){c.items.forEach(function(it,i){if(norm(it.n+" "+it.d+" "+c.name).indexOf(sq)>-1)arr.push({it:it,c:ci,i:i})})});if(!arr.length){var e=document.createElement("div");e.className="empty";e.textContent="مفيش نتيجة لبحثك";l.appendChild(e);return}}
else CONFIG.categories[cur].items.forEach(function(it,i){arr.push({it:it,c:cur,i:i})});
arr.forEach(function(a){var it=a.it,i=a.i,k=key(a.c,i),n=cart[k]||0;var d=document.createElement("div");d.className="item";
d.innerHTML='<div class="i"><b></b><small></small><div class="price"></div></div><div class="qty"></div>';
d.querySelector("b").textContent=it.n;if(HOT[it.n]){var hb=document.createElement("span");hb.className="hot";hb.textContent="الأكثر طلبًا";d.querySelector("b").appendChild(hb)}var sm=d.querySelector("small");if(it.d)sm.textContent=it.d;else sm.style.display="none";d.querySelector(".price").textContent=it.p+" "+CONFIG.currency;
var qd=d.querySelector(".qty");
if(n>0){var m=document.createElement("button");m.className="m";m.textContent="\u2212";m.onclick=function(){chg(k,-1)};var s=document.createElement("span");s.textContent=n;qd.appendChild(m);qd.appendChild(s)}
var p=document.createElement("button");p.textContent="+";p.onclick=function(){chg(k,1)};qd.appendChild(p);l.appendChild(d)})}
function chg(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];drawList();bar()}
function lines(){var o=[],t=0;Object.keys(cart).forEach(function(k){var a=k.split("-"),it=CONFIG.categories[a[0]].items[a[1]];o.push({n:it.n,q:cart[k],s:it.p*cart[k]});t+=it.p*cart[k]});return{o:o,t:t}}
function bar(){var L=lines(),c=L.o.reduce(function(a,x){return a+x.q},0);$("bar").style.display=c?"block":"none";$("open").textContent="تأكيد الطلب ("+c+") - "+(L.t+CONFIG.delivery)+" "+CONFIG.currency}
$("open").onclick=function(){var L=lines();$("lines").innerHTML="";L.o.forEach(function(x){var r=document.createElement("div");r.className="row";r.innerHTML="<span></span><span></span>";r.children[0].textContent=x.q+" × "+x.n;r.children[1].textContent=x.s+" "+CONFIG.currency;$("lines").appendChild(r)});var dr=document.createElement("div");dr.className="row";dr.innerHTML="<span></span><span></span>";dr.children[0].textContent="التوصيل";dr.children[1].textContent=CONFIG.delivery+" "+CONFIG.currency;$("lines").appendChild(dr);$("tot").textContent="الإجمالي: "+(L.t+CONFIG.delivery)+" "+CONFIG.currency;$("sheet").style.display="flex"};
$("close").onclick=function(){$("sheet").style.display="none"};
$("send").onclick=function(){var L=lines();if(!L.o.length)return;var ad=$("ad").value.trim();if(!ad){$("ad").style.borderColor="#e0261a";$("ad").placeholder="اكتب العنوان من فضلك";$("ad").focus();return}
var m="طلب جديد - "+CONFIG.name+"\n",w=$("who").value.trim(),ph=$("ph").value.trim(),nt=$("note").value.trim();
if(w)m+="الاسم: "+w+"\n";if(ph)m+="الموبايل: "+ph+"\n";m+="العنوان: "+ad+"\n\n";L.o.forEach(function(x){m+=x.q+" × "+x.n+" = "+x.s+" "+CONFIG.currency+"\n"});m+="\nمجموع الطلب: "+L.t+" "+CONFIG.currency+"\nالتوصيل: "+CONFIG.delivery+" "+CONFIG.currency+"\nالإجمالي: "+(L.t+CONFIG.delivery)+" "+CONFIG.currency;if(nt)m+="\nملاحظات: "+nt;
var u="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(m);
cart={};drawList();bar();$("sheet").style.display="none";$("note").value="";
$("wal").href=u;$("done").style.display="flex";
setTimeout(function(){location.href=u},350)};
$("back").onclick=function(){$("done").style.display="none";window.scrollTo(0,0)};
drawNav();drawList();bar();
$("sr").oninput=function(){sq=norm(this.value);$("nav").style.opacity=sq?".35":"1";drawList()};
