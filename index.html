<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#f6f1ea;color:#1f2937;padding-bottom:90px}
header{background:#6f4e37;color:#fff;padding:22px 16px 14px;text-align:center}
header h1{margin:0;font-size:30px;font-weight:900;letter-spacing:2px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
#tbl{display:inline-block;margin-top:8px;background:#fff3;border-radius:20px;padding:3px 12px;font-size:13px}
nav{position:sticky;top:0;z-index:5;background:#fff;display:flex;gap:8px;overflow-x:auto;padding:10px;box-shadow:0 1px 6px #0001}
nav button{flex:none;border:0;background:#ece2d6;color:#5a3e2b;padding:8px 16px;border-radius:20px;font:inherit;font-size:15px}
nav button.on{background:#6f4e37;color:#fff}
main{padding:12px;max-width:640px;margin:auto}
.item{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px #0001}
.item .i{flex:1}.item b{display:block;font-size:16px}.item small{color:#6b7280;unicode-bidi:plaintext}
.price{color:#8a5a3b;font-weight:700;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border:0;border-radius:50%;background:#6f4e37;color:#fff;font-size:20px;line-height:1}
.qty button.m{background:#e5e7eb;color:#374151}
.qty span{min-width:18px;text-align:center;font-weight:700}
#bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -2px 10px #0002;display:none}
#bar button{width:100%;border:0;background:#4a3222;color:#fff;font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:12px}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}
#sheet .box{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;max-width:640px;margin:auto}
#sheet h2{margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eee}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:10px;margin-top:8px}
.tot{font-weight:700;font-size:18px;margin:10px 0}
.go{width:100%;border:0;background:#4a3222;color:#fff;font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:12px;margin-top:10px}
.x{width:100%;border:0;background:#f3f4f6;font:inherit;padding:12px;border-radius:12px;margin-top:8px}
footer{text-align:center;color:#9ca3af;font-size:12px;padding:16px}
.pk a{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:20px 18px;margin-bottom:12px;box-shadow:0 1px 5px #0002;color:#1f2937;text-decoration:none;font-size:20px;font-weight:700}
.pk a span{color:#6f4e37;font-size:26px}.pk a:active{background:#ece2d6}
#picker{min-height:100vh}
#splash{position:fixed;inset:0;z-index:100;background:#6f4e37;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .8s ease;opacity:1}
#splash h1{margin:0;font-size:64px;font-weight:900;letter-spacing:6px}
#splash p{margin:10px 0 0;font-size:22px;font-weight:800}
#splash.out{opacity:0}
</style>

var CONFIG={
  name:"OVN",
  tagline:"Order from your table",
  whatsapp:"201013585550",   // cafe WhatsApp number, international format, no + or leading 0
  currency:"LE",
  categories:[]
};
</script>
<div id="splash"><h1>OVN</h1><p>Cafe &amp; Bakery</p></div>
<div id="picker"><header><h1>OVN</h1><p style="font-size:18px;font-weight:800">Cafe &amp; Bakery</p><p>Choose your branch to see the menu and order</p></header><main class="pk" id="pk"></main></div>
<div id="menuview"><header><h1 id="nm"></h1><p id="sb" style="font-size:18px;font-weight:800"></p><p id="tg"></p><span id="tbl"></span><a href="#" style="display:block;margin-top:8px;color:#fff;font-size:13px;opacity:.9">Change branch</a></header>
<nav id="nav"></nav>
<main id="list"></main>
<footer>Prices in Egyptian pounds (LE)</footer>
</div>
<div id="bar"><button id="open"></button></div>
<div id="sheet"><div class="box">
  <h2>Your order</h2><div id="lines"></div><div class="tot" id="tot"></div>
  <input id="who" placeholder="Name (optional)">
  <input id="tn" placeholder="Table number" inputmode="numeric">
  <textarea id="note" rows="2" placeholder="Notes (extra sugar, no ice...)"></textarea>
  <button class="go" id="send">Send order on WhatsApp</button>
  <button class="x" id="close">Back to menu</button>
</div></div>
<script>
var $=function(i){return document.getElementById(i)};
var cart={},cur=0,q=new URLSearchParams(location.search);
$("tg").textContent=CONFIG.tagline;
var table=q.get("table")||q.get("t")||"";
if(table){$("tbl").textContent="Table "+table;$("tn").value=table}else $("tbl").style.display="none";
function key(c,i){return c+"-"+i}
function drawNav(){$("nav").innerHTML="";CONFIG.categories.forEach(function(c,i){var b=document.createElement("button");b.textContent=c.name;b.className=i==cur?"on":"";b.onclick=function(){cur=i;drawNav();drawList();window.scrollTo(0,0)};$("nav").appendChild(b)});var on=$("nav").querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"})}
function drawList(){var l=$("list");l.innerHTML="";CONFIG.categories[cur].items.forEach(function(it,i){var k=key(cur,i),n=cart[k]||0;var d=document.createElement("div");d.className="item";
d.innerHTML='<div class="i"><b></b><small></small><div class="price"></div></div><div class="qty"></div>';
d.querySelector("b").textContent=it.n;d.querySelector("small").textContent=it.d;d.querySelector(".price").textContent=it.p+" "+CONFIG.currency;
var qd=d.querySelector(".qty");
if(n>0){var m=document.createElement("button");m.className="m";m.textContent="−";m.onclick=function(){chg(k,-1)};var s=document.createElement("span");s.textContent=n;qd.appendChild(m);qd.appendChild(s)}
var p=document.createElement("button");p.textContent="+";p.onclick=function(){chg(k,1)};qd.appendChild(p);l.appendChild(d)})}
function chg(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];drawList();bar()}
function lines(){var o=[],t=0;Object.keys(cart).forEach(function(k){var a=k.split("-"),it=CONFIG.categories[a[0]].items[a[1]];o.push({n:it.n,q:cart[k],s:it.p*cart[k]});t+=it.p*cart[k]});return{o:o,t:t}}
function bar(){var L=lines(),c=L.o.reduce(function(a,x){return a+x.q},0);$("bar").style.display=c?"block":"none";$("open").textContent="Review order ("+c+") - "+L.t+" "+CONFIG.currency}
$("open").onclick=function(){var L=lines();$("lines").innerHTML="";L.o.forEach(function(x){var r=document.createElement("div");r.className="row";r.innerHTML="<span></span><span></span>";r.children[0].textContent=x.q+" × "+x.n;r.children[1].textContent=x.s+" "+CONFIG.currency;$("lines").appendChild(r)});$("tot").textContent="Total: "+L.t+" "+CONFIG.currency;$("sheet").style.display="flex"};
$("close").onclick=function(){$("sheet").style.display="none"};
$("send").onclick=function(){var L=lines();if(!L.o.length)return;var m="New order - "+CONFIG.name+" - "+CONFIG.branch+"\n";var tn=$("tn").value.trim(),w=$("who").value.trim(),nt=$("note").value.trim();
if(tn)m+="Table: "+tn+"\n";if(w)m+="Name: "+w+"\n";m+="\n";L.o.forEach(function(x){m+=x.q+" × "+x.n+" = "+x.s+" "+CONFIG.currency+"\n"});m+="\nTotal: "+L.t+" "+CONFIG.currency;if(nt)m+="\nNotes: "+nt;
location.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(m)};
BRANCHES.forEach(function(b){var a=document.createElement("a");a.href="#"+b.id;a.innerHTML="<b></b><span>&rsaquo;</span>";a.firstChild.textContent=b.name;$("pk").appendChild(a)});
var curBranch=null;
function route(){var id=location.hash.replace("#",""),b=null;BRANCHES.forEach(function(x){if(x.id==id)b=x});
if(!b){curBranch=null;$("picker").style.display="block";$("menuview").style.display="none";$("bar").style.display="none";$("sheet").style.display="none";window.scrollTo(0,0);return}
if(curBranch!==b.id){curBranch=b.id;cart={};cur=0;CONFIG.categories=MENUS[b.menu];CONFIG.branch=b.name;$("nm").textContent=CONFIG.name;$("sb").textContent="Cafe & Bakery - "+b.name;drawNav();drawList();bar();window.scrollTo(0,0)}
$("picker").style.display="none";$("menuview").style.display="block";$("sheet").style.display="none";bar()}
window.addEventListener("hashchange",route);route();
(function(){if(location.hash)return;var sp=$("splash");sp.style.display="flex";document.body.style.overflow="hidden";
setTimeout(function(){sp.classList.add("out");setTimeout(function(){sp.style.display="none";document.body.style.overflow=""},850)},3000)})();
</script>
</body>
